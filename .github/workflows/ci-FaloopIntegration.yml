name: CI (FaloopIntegration)

on:
  push:
    paths:
      - FaloopIntegration/**
      - Directory.Build.props
    branches:
      - master
  pull_request:
    paths:
      - FaloopIntegration/**
      - Directory.Build.props
    types:
      - opened
      - synchronize
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build:
    uses: SlashNephy/Divination/.github/workflows/reusable-build-plugin.yml@b1df9d806d8b3d78b2e6915d1bac3e03b968e9dc # master
    with:
      plugin-name: FaloopIntegration
      working-directory: FaloopIntegration
    permissions:
      contents: read
      actions: write

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    uses: SlashNephy/Divination/.github/workflows/reusable-deploy-plugin.yml@b1df9d806d8b3d78b2e6915d1bac3e03b968e9dc # master
    with:
      plugin-name: FaloopIntegration
    secrets:
      DEPLOY_GITHUB_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
    permissions:
      actions: read
