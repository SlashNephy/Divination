name: CI (FaloopIntegration)

on:
  push:
    paths:
      - FaloopIntegration/**
      - Directory.Build.props
    branches:
      - master
  pull_request:
    paths:
      - FaloopIntegration/**
      - Directory.Build.props
    types:
      - opened
      - synchronize
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build:
    uses: SlashNephy/Divination/.github/workflows/reusable-build-plugin.yml@d2ea413964099079fd795d4cf31d5ccc263d3b41 # master
    with:
      plugin-name: FaloopIntegration
      working-directory: FaloopIntegration
    permissions:
      contents: read
      actions: write

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    uses: './.github/workflows/reusable-deploy-plugin.yml'
    with:
      plugin-name: FaloopIntegration
    secrets:
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
    permissions:
      actions: read
