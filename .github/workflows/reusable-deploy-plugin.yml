name: 'Deploy Plugin'

on:
  workflow_call:
    inputs:
      plugin-name:
        required: true
        type: string
      plugin-repository:
        required: false
        type: string
        default: 'SlashNephy/divination-distrib'
    secrets:
      DEPLOY_APP_PRIVATE_KEY:
        required: true

permissions:
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # create-github-app-token takes bare repository names, so strip the owner
      # from the owner/repo input.
      - name: Resolve Plugin Repository Name
        id: plugin-repository
        env:
          PLUGIN_REPOSITORY: '${{ inputs.plugin-repository }}'
        run: echo "name=${PLUGIN_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      # Mint a 1-hour token scoped to the deployment target repository.
      # The post step revokes it when the job ends.
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: 'Iv23liyjT3RUuzI5oVIL' # divination-deploy
          private-key: '${{ secrets.DEPLOY_APP_PRIVATE_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ steps.plugin-repository.outputs.name }}'
          permission-contents: 'write'
          permission-pull-requests: 'write'

      - name: Checkout Plugin Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: '${{ inputs.plugin-repository }}'
          token: '${{ steps.app-token.outputs.token }}'

      - name: Download Artifact (release)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: '${{ inputs.plugin-name }}'
          path: 'plugins/testing/${{ inputs.plugin-name }}'

      - name: Download Artifact (gitversion.json)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: '${{ inputs.plugin-name }}-GitVersion'
          path: 'gitversion'

      - name: Read InformationalVersion
        id: version
        run: |
          value=$(cat gitversion/gitversion.json | jq .InformationalVersion)
          rm -rf gitversion
          echo "value=$value" >> $GITHUB_OUTPUT

      # This repository is public, so no authentication is needed. Expanding a
      # token on the command line would also expose it through the process list.
      - name: Prepare commits.json
        run: |
          curl \
            -o 'plugins/testing/${{ inputs.plugin-name }}/commits.json' \
            -H 'Accept: application/vnd.github.v3+json' \
            'https://api.github.com/repos/${{ github.repository }}/commits'

      - name: Prepare event.json
        run: echo "$EVENT_JSON" | jq -c > plugins/testing/${{ inputs.plugin-name }}/event.json
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}

      - name: Copy Artifact (stable)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p plugins/stable/${{ inputs.plugin-name }}
          cp -rf plugins/testing/${{ inputs.plugin-name }}/* plugins/stable/${{ inputs.plugin-name }}

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: '${{ steps.app-token.outputs.token }}'
          commit-message: '⚙️ Deploy ${{ inputs.plugin-name }} ${{ steps.version.outputs.value }}'
          branch: ci/update-plugin-master
          branch-suffix: random
          delete-branch: true
          title: '⚙️ Deploy ${{ inputs.plugin-name }} ${{ steps.version.outputs.value }}'

      - name: Automerge
        if: steps.create-pull-request.outputs.pull-request-number
        run: gh pr merge --repo ${PLUGIN_REPOSITORY} --squash ${PR_NUMBER}
        env:
          GH_TOKEN: '${{ steps.app-token.outputs.token }}'
          PLUGIN_REPOSITORY: ${{ inputs.plugin-repository }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
